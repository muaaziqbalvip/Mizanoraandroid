name: Build & Release APK

on:
  workflow_dispatch:
  push:
    paths: ["android/**"]
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: gradle -p android assembleDebug -PpanelUrl="${{ vars.PANEL_URL }}"
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MizanoraAndroid.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MizanoraAndroid ${{ github.run_number }}
          files: MizanoraAndroid.apk
