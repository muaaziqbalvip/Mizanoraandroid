<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MizanoraAndroid</title>
<script>
  window.MIZANORA_REPO = "muaaziqbalvip/Mizanoraandroid";
  window.UDID = "emulator-5554";
</script>
<style>
  :root{ --bg:#0f1722; --panel:#172233; --line:#26354d; --text:#e8eef7; --dim:#8da0ba;
         --live:#46d3a8; --wait:#f2b84b; --off:#e5675f; color-scheme:dark; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:#000;color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;
       padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
  header{display:flex;align-items:center;gap:10px;padding:4px 10px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px}
  h1{font-size:13px;font-weight:650;margin:0;flex:1}
  .pill{display:flex;align-items:center;gap:6px;color:var(--dim)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--off)}
  .live .dot{background:var(--live)} .wait .dot{background:var(--wait)}
  main{flex:1;min-height:0;position:relative}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--dim);background:var(--bg)}
  .msg strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
  button{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:12px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>MizanoraAndroid</h1>
  <div id="pill" class="pill"><span class="dot"></span><span id="label">Checking…</span></div>
  <button id="reload" type="button">Reload</button>
</header>
<main>
  <iframe id="frame" title="Android screen" allow="clipboard-read; clipboard-write; fullscreen; autoplay" hidden></iframe>
  <div id="msg" class="msg"><div><strong>Looking for your phone</strong>Reading the latest status from GitHub.</div></div>
</main>
<script>
const repo = window.MIZANORA_REPO, udid = window.UDID;
const player = new URLSearchParams(location.search).get("player") || "webcodecs"; // or mse / broadway / tinyh264
const statusUrl = `https://raw.githubusercontent.com/${repo}/status/status.json`;
const STALE_SECS = 6 * 60;
let current = "";
const $ = id => document.getElementById(id);

function streamUrl(base){
  const host = new URL(base).host;
  const ws = `wss://${host}/?action=proxy-adb&remote=tcp%3A8886&udid=${udid}`;
  return `${base}/#!action=stream&udid=${udid}&player=${player}&ws=${encodeURIComponent(ws)}`;
}
function setState(kind, text){ $("pill").className = "pill " + kind; $("label").textContent = text; }
function showMsg(title, body){
  $("frame").hidden = true; $("msg").hidden = false;
  $("msg").innerHTML = `<div><strong>${title}</strong>${body}</div>`; current = "";
}
function load(url){ current = url; $("frame").src = streamUrl(url); }

async function poll(){
  try{
    const r = await fetch(statusUrl + "?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const s = await r.json();
    const age = Math.floor(Date.now()/1000) - s.ts;
    if(age > STALE_SECS){
      setState("off", "Restarting");
      showMsg("Phone is restarting", "It saves your apps and data, then boots again. This takes about 8 minutes.");
    } else {
      setState("live", "Live");
      if(s.url !== current) load(s.url);
      $("frame").hidden = false; $("msg").hidden = true;
    }
  }catch(e){
    setState("wait", "No status yet");
    showMsg("No status found", "Run the “Emulator (24/7 loop)” workflow once.");
  }
}
$("reload").onclick = () => { if(current) load(current); };
poll(); setInterval(poll, 20000);
</script>
</body>
</html>
