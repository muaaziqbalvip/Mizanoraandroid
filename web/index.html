<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MizanoraAndroid</title>
<script>
  // >>> EDIT THIS: your GitHub "owner/repo" (repo must be public)
  window.MIZANORA_REPO = "muaaziqbalvip/Mizanoraandroid";
</script>
<style>
  :root{
    --bg:#0f1722; --panel:#172233; --line:#26354d; --text:#e8eef7; --dim:#8da0ba;
    --live:#46d3a8; --wait:#f2b84b; --off:#e5675f;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
  }
  header{display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel)}
  h1{font-size:16px; font-weight:650; margin:0; letter-spacing:.01em; flex:1}
  .pill{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim)}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--off)}
  .live .dot{background:var(--live); box-shadow:0 0 0 0 rgba(70,211,168,.6); animation:pulse 2s infinite}
  .wait .dot{background:var(--wait)}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(70,211,168,0)}100%{box-shadow:0 0 0 0 rgba(70,211,168,0)}}
  @media (prefers-reduced-motion:reduce){.live .dot{animation:none}}
  main{flex:1; min-height:0; position:relative}
  iframe{position:absolute; inset:0; width:100%; height:100%; border:0; background:#000}
  .msg{position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:24px; color:var(--dim)}
  .msg strong{display:block; color:var(--text); font-size:18px; margin-bottom:6px}
  a.btn{color:var(--text); border:1px solid var(--line); padding:6px 12px; border-radius:8px; text-decoration:none; font-size:13px}
  a.btn:focus-visible{outline:2px solid var(--live); outline-offset:2px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>MizanoraAndroid</h1>
  <div id="pill" class="pill"><span class="dot"></span><span id="label">Checking…</span></div>
  <a id="open" class="btn" target="_blank" rel="noopener" hidden>Open full</a>
</header>
<main>
  <iframe id="frame" title="Android screen" allow="clipboard-read; clipboard-write; fullscreen" hidden></iframe>
  <div id="msg" class="msg"><div><strong>Looking for your phone</strong>Reading the latest status from GitHub.</div></div>
</main>
<script>
const repo = window.MIZANORA_REPO;
const statusUrl = `https://raw.githubusercontent.com/${repo}/status/status.json`;
const STALE_SECS = 6 * 60;   // heartbeat is every 2 min
let current = "";

const $ = id => document.getElementById(id);
function setState(kind, text){
  $("pill").className = "pill " + kind;
  $("label").textContent = text;
}
function showMsg(title, body){
  $("frame").hidden = true; $("open").hidden = true;
  $("msg").hidden = false;
  $("msg").innerHTML = `<div><strong>${title}</strong>${body}</div>`;
  current = "";
}
async function poll(){
  try{
    const r = await fetch(statusUrl + "?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const s = await r.json();
    const age = Math.floor(Date.now()/1000) - s.ts;
    if(age > STALE_SECS){
      setState("off", "Offline");
      showMsg("Phone is offline", "The watchdog restarts it within about 15 minutes.");
    } else {
      setState("live", "Live");
      if(s.url !== current){
        current = s.url;
        $("frame").src = s.url;
        $("open").href = s.url;
      }
      $("frame").hidden = false; $("open").hidden = false; $("msg").hidden = true;
    }
  }catch(e){
    setState("wait", "No status yet");
    showMsg("No status found", "Run the “Emulator (24/7 loop)” workflow once, and check that MIZANORA_REPO is set in web/index.html.");
  }
}
poll(); setInterval(poll, 20000);
</script>
</body>
</html>
